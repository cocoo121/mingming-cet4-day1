const days=raw.map((s,d)=>s.split(",").map((x,i)=>{let p=x.indexOf(":"),word=x.slice(0,p),meaning=x.slice(p+1),studyDay=d<6?d+1:d+2;return{word,meaning,pos:"CET-4",id:d+"-"+i,day:studyDay,example:"The word “"+word+"” is useful in English reading.",translation:"“"+word+"”是英语阅读中的实用词汇。"}})),all=days.flat(),studyDays=Object.fromEntries(days.map(group=>[group[0].day,group])),KEY="mingming-cet4-week-v1";let state;try{state={data:{},mistakes:{},done:[],...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{state={data:{},mistakes:{},done:[]}}let day=1,words=[],wi=0,quiz=[],qi=0,score=0,qWrong=[],answered=false;const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),ds=d=>(state.data[d]??={seen:[],mastered:[],index:0}),shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},wrongWordsFor=reviewDay=>{let from=reviewDay===7?1:8,to=reviewDay===7?6:13;return Object.entries(state.mistakes).map(([w,n])=>{let item=all.find(x=>x.word===w&&x.day>=from&&x.day<=to);return item?{...item,mistakeCount:typeof n==="number"?n:n.count||1}:null}).filter(Boolean).sort((a,b)=>b.mistakeCount-a.mistakeCount)},unlocked=d=>d===1||state.done.includes(d-1);
function show(id){["home","lesson","quiz"].forEach(x=>$("#"+x).classList.toggle("hide",x!==id));$("#homeBtn").classList.toggle("hide",id==="home");scrollTo(0,0)}
function toast(message){$("#toast").textContent=message;$("#toast").classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>$("#toast").classList.remove("show"),1900)}
let activeAudio=null;
function systemSpeak(t,button){if(!("speechSynthesis" in window)){toast("当前浏览器暂不支持朗读");return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.78;let voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;if(button){u.onstart=()=>button.classList.add("playing");u.onend=u.onerror=()=>button.classList.remove("playing")}speechSynthesis.speak(u)}
function speak(t,button){if(activeAudio){activeAudio.pause();activeAudio=null}let audio=new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(t)+"&type=2");activeAudio=audio;if(button)button.classList.add("playing");let finish=()=>{if(button)button.classList.remove("playing");if(activeAudio===audio)activeAudio=null};audio.onended=finish;audio.onerror=()=>{finish();systemSpeak(t,button)};let play=audio.play();if(play&&play.catch)play.catch(()=>{finish();systemSpeak(t,button)})}
function fitLongWord(selector){let el=$(selector);if(el)el.classList.toggle("long",el.textContent.trim().length>=10)}
new MutationObserver(()=>fitLongWord("#word")).observe($("#word"),{childList:true});
new MutationObserver(()=>fitLongWord("#qTitle")).observe($("#qTitle"),{childList:true});
function renderHome(){let totalWrong=wrongWordsFor(7).length+wrongWordsFor(14).length;$("#sumTitle").textContent=state.done.length===14?"两周挑战全部完成啦！":state.done.length?"已经完成 "+state.done.length+" 天，继续保持":"准备开始第一天";$("#sumText").textContent="两周共记录 "+totalWrong+" 个错词；完成当天检验后，下一天自动解锁。";let card=d=>{let ok=unlocked(d),done=state.done.includes(d),review=d===7||d===14,wc=review?wrongWordsFor(d).length:0;return '<button class="day '+(done?"done ":"")+(ok&&!done?"current":"")+'" data-d="'+d+'" '+(ok?"":"disabled")+'><span class="num">'+d+'</span><span class="status">'+(done?"✓ 已完成":ok?"开始学习":"🔒 未解锁")+'</span><h3>'+(review?"本周错词总复习":"高频词 · 第"+d+"天")+'</h3><p>'+(review?wc+"个错词":"30个新词")+'<br>'+(review?"按错误次数智能排序":"学习＋选择＋听音默写")+"</p></button>"};$("#days").innerHTML='<div class="week-label"><b>第一周</b><span>Day 1—7 · 基础积累</span></div>'+Array.from({length:7},(_,i)=>card(i+1)).join("")+'<div class="week-label"><b>第二周</b><span>Day 8—14 · 继续进阶</span></div>'+Array.from({length:7},(_,i)=>card(i+8)).join("");document.querySelectorAll(".day:not(:disabled)").forEach(b=>b.onclick=()=>openDay(+b.dataset.d));save();show("home")}
function openDay(d){day=d;words=(d===7||d===14)?wrongWordsFor(d):studyDays[d];wi=Math.min(ds(d).index||0,Math.max(0,words.length-1));renderLesson();show("lesson")}function renderLesson(){let D=ds(day),review=day===7||day===14,weekReview=day<=7?7:14;$("#lessonKicker").textContent="DAY "+day+(review?" · REVIEW":"");$("#lessonTitle").textContent=review?"把本周的错词真正拿下":"今天稳稳拿下30个单词";$("#lessonDesc").textContent=review?"错得越多的词排得越靠前。":"先听发音，再看释义和例句。";if(!words.length){$("#card").innerHTML='<div class="empty"><h2>本周前六天没有留下错词 🎉</h2><button class="btn orange" onclick="renderHome()">返回首页</button></div>';$("#grid").innerHTML="";$("#goQuiz").disabled=true;return}$("#goQuiz").disabled=false;let w=words[wi],seen=new Set(D.seen),mastered=new Set(D.mastered);seen.add(w.id);D.seen=[...seen];D.index=wi;$("#wordNo").textContent="WORD "+(wi+1)+" / "+words.length+(w.mistakeCount?" · 错过"+w.mistakeCount+"次":"");$("#word").textContent=w.word;$("#pos").textContent=w.pos;$("#meaning").textContent=w.meaning;$("#example").textContent=w.example;$("#translation").textContent=w.translation;let yes=mastered.has(w.id);$("#master").textContent=yes?"✓ 已经掌握":"○ 标记已掌握";$("#master").classList.toggle("on",yes);$("#seen").textContent=seen.size;$("#mastered").textContent=mastered.size;$("#wrongCount").textContent=wrongWordsFor(weekReview).length;$("#bar").style.width=mastered.size/words.length*100+"%";$("#prev").disabled=wi===0;$("#next").textContent=wi===words.length-1?"去检验 →":"下一个 →";$("#grid").innerHTML=words.map((x,i)=>'<button class="dot '+(i===wi?"now ":"")+(mastered.has(x.id)?"done":"")+'" data-i="'+i+'">'+(i+1)+"</button>").join("");document.querySelectorAll(".dot").forEach(b=>b.onclick=()=>{wi=+b.dataset.i;renderLesson()});save()}
function openQuiz(){if(!words.length)return;$("#quizKicker").textContent="DAY "+day+" · CHECK";$("#quizTitle").textContent=(day===7||day===14)?"本周最后一次，把错词拿下":"今天学会了多少？";$("#quizText").textContent="随机抽取最多15个词。第一轮只看英文选中文；第二轮不显示英文，根据中文和发音默写。";$("#quizIntro").classList.remove("hide");$("#quizArea").classList.add("hide");$("#result").classList.add("hide");show("quiz")}function startQuiz(){let p=words.length<=15?[...words]:shuffle(words).slice(0,15);quiz=[...p.map(w=>({t:0,w})),...shuffle(p).map(w=>({t:1,w}))];qi=score=0;qWrong=[];$("#quizIntro").classList.add("hide");$("#quizArea").classList.remove("hide");renderQ()}
function renderQ(){answered=false;let q=quiz[qi],h=quiz.length/2,p=q.t?qi-h+1:qi+1;$("#qProgress").textContent="第"+(q.t?2:1)+"轮 · "+p+" / "+h;$("#liveScore").textContent="答对 "+score+" 题";$("#feedback").className="feedback hide";$("#nextQ").classList.add("hide");$("#choices").innerHTML="";$("#spellInput").value="";$("#spellInput").disabled=false;if(!q.t){$("#kind").textContent="选择正确的中文释义";$("#qTitle").textContent=q.w.word;$("#prompt").textContent="第一轮只需要选择中文意思。";$("#choices").classList.remove("hide");$("#spell").classList.add("hide");let o=shuffle(all.filter(x=>x.word!==q.w.word&&x.meaning!==q.w.meaning)).slice(0,3).map(x=>x.meaning);shuffle([q.w.meaning,...o]).forEach(x=>{let b=document.createElement("button");b.className="choice";b.textContent=x;b.onclick=()=>answerChoice(b,x,q.w);$("#choices").appendChild(b)})}else{$("#kind").textContent="根据中文默写英文单词";$("#qTitle").textContent=q.w.meaning;$("#prompt").textContent="页面不会显示英文，需要时点击右侧按钮听发音。";$("#choices").classList.add("hide");$("#spell").classList.remove("hide")}}
function feedback(ok,w,g){answered=true;if(ok)score++;else{qWrong.push(w);state.mistakes[w.word]=(state.mistakes[w.word]||0)+1}$("#feedback").className="feedback "+(ok?"good":"bad");$("#feedback").innerHTML=ok?"<b>回答正确！</b> "+w.word+" — "+w.meaning:"<b>已加入错词本。</b> 正确答案是 <b>"+w.word+"</b>，你的答案："+g;$("#liveScore").textContent="答对 "+score+" 题";$("#nextQ").classList.remove("hide");save()}function answerChoice(b,x,w){if(answered)return;document.querySelectorAll(".choice").forEach(c=>{c.disabled=true;if(c.textContent===w.meaning)c.classList.add("correct")});if(x!==w.meaning)b.classList.add("wrong");feedback(x===w.meaning,w,x)}function submit(e){e.preventDefault();if(answered)return;let w=quiz[qi].w,g=$("#spellInput").value.trim().toLowerCase();if(!g)return;$("#spellInput").disabled=true;feedback(g===w.word.toLowerCase(),w,g)}function nextQ(){if(++qi<quiz.length)renderQ();else showResult()}function showResult(){let u=[...new Map(qWrong.map(w=>[w.word,w])).values()];$("#quizArea").classList.add("hide");$("#result").classList.remove("hide");$("#resultTitle").textContent=score/quiz.length>=.8?"今天的状态很棒！":"完成比完美更重要";$("#finalScore").textContent=score+" / "+quiz.length;$("#resultText").textContent="错词已自动加入第"+(day<=7?7:14)+"天复习。";$("#wrongList").innerHTML=u.map(w=>'<div class="wrongrow"><b>'+w.word+"</b><span>"+w.meaning+"</span></div>").join("")}function finish(){if(!state.done.includes(day))state.done.push(day);state.done.sort();save();renderHome()}
$("#homeBtn").onclick=renderHome;$("#speakWord").onclick=()=>speak(words[wi].word,$("#speakWord"));$("#qSpeak").onclick=()=>speak(quiz[qi].w.word,$("#qSpeak"));$("#master").onclick=()=>{let D=ds(day),s=new Set(D.mastered),id=words[wi].id;s.has(id)?s.delete(id):s.add(id);D.mastered=[...s];renderLesson()};$("#prev").onclick=()=>{if(wi){wi--;renderLesson()}};$("#next").onclick=()=>{if(wi<words.length-1){wi++;renderLesson()}else openQuiz()};$("#random").onclick=()=>{wi=Math.floor(Math.random()*words.length);renderLesson()};$("#goQuiz").onclick=openQuiz;$("#startQuiz").onclick=startQuiz;$("#spell").onsubmit=submit;$("#nextQ").onclick=nextQ;$("#review").onclick=()=>{renderLesson();show("lesson")};$("#finish").onclick=finish;renderHome();
